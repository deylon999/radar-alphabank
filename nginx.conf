server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Файлы сборки с хешем в имени не меняются — кешируем надолго.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service Worker моков и index.html всегда свежие, иначе после обновления сайт застрянет на старой версии.
  location = /mockServiceWorker.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
