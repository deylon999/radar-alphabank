# Страны ЕС и присоединившиеся к ограничениям: для них растёт вес фактора санкций.
sanction_sensitive_countries: [Литва, Латвия, Эстония, Польша, Германия, Италия, Франция, Нидерланды, Бельгия, Финляндия, Чехия, Словакия, Словения, Венгрия, Греция, Кипр, Ирландия, Португалия, Испания, Австрия, Люксембург, Хорватия, Болгария, Румыния, Дания, Швеция, Великобритания, США, Канада, Япония, Швейцария, Норвегия, Австралия, Южная Корея, Тайвань, Сингапур]

# Должность пользователя → множитель темы. Влияет только на порядок ленты и акценты разбора.
roles:
  owner: {financing: 1.1, currency: 1.0, costs: 1.0, demand: 1.15, regulation: 1.1, logistics: 1.0}
  ceo: {financing: 1.0, currency: 1.0, costs: 1.1, demand: 1.2, regulation: 1.1, logistics: 1.1}
  cfo: {financing: 1.3, currency: 1.2, costs: 1.1, demand: 1.0, regulation: 1.0, logistics: 0.9}
  accountant: {financing: 0.9, currency: 1.0, costs: 1.0, demand: 0.8, regulation: 1.4, logistics: 0.8}
  treasurer: {financing: 1.4, currency: 1.4, costs: 0.9, demand: 0.8, regulation: 0.9, logistics: 0.8}
  other: {financing: 1.0, currency: 1.0, costs: 1.0, demand: 1.0, regulation: 1.0, logistics: 1.0}

role_focus:
  owner: стоимость бизнеса, стратегические риски и возможности
  ceo: операционные последствия, спрос, поставки и сроки
  cfo: долговая нагрузка, процентные расходы, денежный поток и бюджет
  accountant: налоги, отчётность, учёт и регуляторные требования
  treasurer: ликвидность, ставки, валютные позиции и хеджирование
  other: общее влияние на бизнес
