# Справочник «ОКВЭД → сектор → факторы чувствительности».
# Сектор выбирается по самому длинному совпавшему префиксу кода ОКВЭД (например, 46.71 точнее, чем 46).
# factors: фактор → вес 0..1 (насколько сильно сектор зависит от фактора без учёта особенностей компании).
# trade_role: кем компания с данными ФТС скорее является — exporter, importer или unknown.
# Это предположение, а не факт: в выводах оно помечается как предположение.
# Новая отрасль = новая запись здесь. Код менять не нужно.

