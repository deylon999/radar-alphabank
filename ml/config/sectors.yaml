# Финансовая структура по продуктам банка. Продукт усиливает фактор, через который событие бьёт по компании.
products:
  loan: {label: кредиты, factors: {key_rate: 1.0, credit_conditions: 0.7}}
  leasing: {label: лизинг, factors: {key_rate: 0.8, credit_conditions: 0.4}}
  guarantee: {label: банковские гарантии, factors: {state_spending: 0.6, credit_conditions: 0.4}}
  deposit: {label: депозиты, factors: {key_rate: 0.7}}
  factoring: {label: факторинг, factors: {key_rate: 0.6, credit_conditions: 0.5}}
  payroll: {label: зарплатный проект, factors: {labor_market: 0.6, taxes: 0.4}}
  settlement: {label: расчётный счёт, factors: {}}

