# Факторы чувствительности: внешние величины и решения, через которые событие влияет на компанию.
# patterns — регулярные выражения по тексту новости (нижний регистр, «ё» заменена на «е»).
# bank_query — запрос к аналитике банка; indicators — показатели, позиции банка по которым ищем.
# Добавить фактор = добавить запись сюда и сослаться на неё в sectors.yaml. Код менять не нужно.

key_rate:
  label: Ключевая ставка
  topic: financing
  patterns:
    - 'ключев\w* ставк'
    - 'денежно-кредитн\w* политик'
    - 'совет\w* директоров банка россии'
    - 'смягчени\w* (дкп|денежно)'
  bank_query: ключевая ставка прогноз решение банка россии
  indicators: [key_rate]
  directions:
    hold: ['сохранил\w*.{0,40}ставк', 'ставк\w*.{0,40}(сохранил|без изменени|оставил|на прежнем уровне)', 'пауз\w* в (цикле )?(снижени|смягчени)']
    up: ['повысил\w*.{0,30}ставк', 'ставк\w*.{0,30}(повыш|подня)']
    down: ['снизил\w*.{0,30}ставк', 'ставк\w*.{0,30}(снизил|снижени|понизил)']

credit_conditions:
  label: Условия кредитования
  topic: financing
  patterns:
    - 'кредитовани\w* (бизнес|компани|корпоратив|юрлиц)'
    - 'корпоративн\w* кредит'
    - 'макропруденциальн'
    - 'ставк\w* по (кредит|депозит)'
    - 'максимальн\w* процентн\w* ставк'
    - 'стоимост\w* (заемн|кредит|фондирован)'
  bank_query: кредитование ставки по кредитам корпоративный кредит
  indicators: [key_rate, loan_rates]

bond_market:
  label: Рынок облигаций
  topic: financing
  patterns: ['облигац', '\bофз\b', 'доходност\w* (офз|облигац)', 'размещени\w* облигац', 'кривая доходност']
  bank_query: облигации ОФЗ доходность бонд бриф
  indicators: [ofz_yield, key_rate]

inflation:
  label: Инфляция
  topic: costs
  patterns: ['инфляци', 'потребительск\w* цен', 'индекс\w* потребительских', '\bипц\b', 'рост цен']
  bank_query: инфляция недельная оценка цены
  indicators: [inflation]
  directions:
    up: ['инфляци\w*.{0,40}(ускорил|выросл|повысил)', 'цен\w*.{0,30}(выросл|ускорил)']
    down: ['инфляци\w*.{0,40}(замедлил|снизил)', 'дефляци']

fx_usd:
  label: Курс доллара
  topic: currency
  patterns: ['курс\w* доллар', 'доллар\w* сша', '\busd\b', 'доллар.{0,20}рубл', 'рубл\w*.{0,20}доллар']
  bank_query: курс рубля доллар прогноз
  indicators: [usd_rub]
  directions:
    rub_weaker: ['рубл\w*.{0,30}(ослаб|подешевел|упал)', '(доллар|курс)\w*.{0,30}(вырос|подорожал|поднял)']
    rub_stronger: ['рубл\w*.{0,30}(укрепил|подорожал|вырос)', '(доллар|курс)\w*.{0,30}(снизил|подешевел|упал)']

fx_eur:
  label: Курс евро
  topic: currency
  patterns: ['курс\w* евро', '\beur\b', 'евро.{0,20}рубл', 'рубл\w*.{0,20}евро']
  bank_query: курс рубля евро прогноз
  indicators: [eur_rub]
  directions:
    rub_weaker: ['рубл\w*.{0,30}(ослаб|подешевел)', 'евро\w*.{0,30}(вырос|подорожал)']
    rub_stronger: ['рубл\w*.{0,30}укрепил', 'евро\w*.{0,30}(снизил|подешевел)']

fx_cny:
  label: Курс юаня
  topic: currency
  patterns: ['юан', '\bcny\b', 'китайск\w* валют']
  bank_query: курс юаня рубль прогноз
  indicators: [cny_rub]
  directions:
    rub_weaker: ['рубл\w*.{0,30}(ослаб|подешевел)', 'юан\w*.{0,30}(вырос|подорожал|поднял|выше)']
    rub_stronger: ['рубл\w*.{0,30}укрепил', 'юан\w*.{0,30}(снизил|подешевел|упал|ниже)']

oil:
  label: Цены на нефть
  topic: costs
  patterns: ['нефт(ь|и|яные цены)', '\bbrent\b', '\burals\b', 'опек']
  bank_query: нефть Brent Urals прогноз сырьевые рынки
  indicators: [brent, urals]
  directions:
    up: ['(нефт|brent|urals)\w*.{0,40}(подорожал|вырос|поднял)']
    down: ['(нефт|brent|urals)\w*.{0,40}(подешевел|снизил|упал)']

fuel:
  label: Топливный рынок
  topic: costs
  patterns: ['бензин', 'дизел', 'дизтоплив', 'моторн\w* топлив', '\bазс\b', '\bнпз\b', 'демпфер', 'биржев\w* цен\w* на топлив', 'нефтепродукт']
  bank_query: топливо бензин дизель цены нефтепродукты
  indicators: [fuel_prices]
  directions:
    up: ['(бензин|дизел|топлив)\w*.{0,40}(подорожал|вырос|рекорд)']
    down: ['(бензин|дизел|топлив)\w*.{0,40}(подешевел|снизил)']

gas:
  label: Газ
  topic: costs
  patterns: ['природн\w* газ', 'газов\w* (рынок|тариф|цен)', 'цен\w* на газ', '\bспг\b', 'газоснабжени']
  bank_query: газ цены тарифы
  indicators: [gas_price]

metals:
  label: Металлы и сталь
  topic: costs
  patterns: ['стал(ь|и)\b', 'металлург', 'металлопрокат', 'прокат', 'арматур', 'алюмини', '\bмед(ь|и)\b', 'никел', 'черн\w* металл', 'цветн\w* металл', 'чугун']
  bank_query: металлы сталь цены сырьевые рынки
  indicators: [steel, aluminium, copper, nickel]
  directions:
    up: ['(стал|металл|прокат|арматур|алюмини|мед)\w*.{0,40}(подорожал|вырос)']
    down: ['(стал|металл|прокат|арматур|алюмини|мед)\w*.{0,40}(подешевел|снизил|упал)']

gold:
  label: Золото
  topic: costs
  patterns: ['золот']
  bank_query: рынок золота обзор
  indicators: [gold]

coal:
  label: Уголь
  topic: costs
  patterns: ['угол(ь|ь\w*)\b', 'угольн', 'энергетическ\w* угл']
  bank_query: уголь цены экспорт
  indicators: [coal]

grain:
  label: Зерно и агрорынок
  topic: demand
  patterns: ['зерн', 'пшениц', 'урожа', 'подсолнечн', 'ячмен', 'кукуруз', 'агропром', 'сельхозпроизвод']
  bank_query: зерно урожай экспортная пошлина сельское хозяйство
  indicators: [grain]
  directions:
    up: ['(зерн|пшениц)\w*.{0,40}(подорожал|вырос)']
    down: ['(зерн|пшениц)\w*.{0,40}(подешевел|снизил|упал)', 'неурожа']

fertilizers:
  label: Удобрения
  topic: costs
  patterns: ['удобрени', 'агрохими', 'аммиак', 'карбамид']
  bank_query: удобрения цены
  indicators: [fertilizers]

electricity:
  label: Электроэнергия и тарифы
  topic: costs
  patterns: ['электроэнерги', 'энерготариф', 'тариф\w* (на )?(электр|жкх|естественных монополий)', 'оптов\w* рынок электр', 'энергосбыт']
  bank_query: тарифы электроэнергия естественные монополии
  indicators: [tariffs]

construction_materials:
  label: Стройматериалы
  topic: costs
  patterns: ['цемент', 'бетон', 'стройматериал', 'строительн\w* материал', 'кирпич']
  directions:
    down: ['(потреблени|спрос|производств)\w* цемент\w*.{0,40}(сократил|снизил|упал)', 'цемент\w*.{0,40}(подешевел|снизил)']
    up: ['цемент\w*.{0,40}(подорожал|вырос)']
  bank_query: строительство стройматериалы цены
  indicators: [construction]

real_estate:
  label: Жильё и ипотека
  topic: demand
  patterns: ['ипотек', 'жилищн\w* строительств', 'ввод\w* жиль', 'застройщик', 'эскроу', 'рынок жиль', 'новостро', 'девелопер', '(замедлени|спад)\w* (в )?строительств']
  bank_query: ипотека жилищное строительство спрос на жилье
  indicators: [mortgage, construction]
  directions:
    down: ['ипотек\w*.{0,40}(снизил|упал|сократил)', 'выдач\w* ипотек\w*.{0,30}(снизил|упал|сократил)']
    up: ['ипотек\w*.{0,40}(вырос|увеличил)']

consumer_demand:
  label: Потребительский спрос
  topic: demand
  patterns: ['потребительск\w* (спрос|активност|кредит)', 'розничн\w* (продаж|торговл|оборот)', 'оборот\w* розничной', 'потреблени\w* (домохозяйств|населени|в стране|на пике)', 'частн\w* потреблени', '^потреблени\w* на пике', 'расходы населени', 'реальн\w* (располагаем|доход|зарплат)', 'платеж\w* по картам']
  bank_query: потребление спрос розничная торговля доходы населения
  indicators: [consumption, real_wages]
  directions:
    up: ['(потреблени|спрос|продаж|оборот)\w*.{0,40}(вырос|ускорил|увеличил)']
    down: ['(потреблени|спрос|продаж|оборот)\w*.{0,40}(снизил|замедлил|сократил|упал)', 'на пике']

auto_market:
  label: Авторынок
  topic: demand
  patterns: ['авторын', 'продаж\w* (новых )?(легковых )?автомобил', 'утильсбор', 'автокредит', 'автодилер', 'автопроизвод', 'импорт\w* автомобил']
  bank_query: авторынок продажи автомобилей утильсбор
  indicators: [auto_sales]

labor_market:
  label: Рынок труда и зарплаты
  topic: costs
  patterns: ['рынк\w* труда', 'безработиц', 'дефицит\w* (кадров|персонал|работник)', 'заработн\w* плат', 'зарплат', 'мрот', 'занятост']
  bank_query: рынок труда зарплаты безработица
  indicators: [unemployment, wages]

taxes:
  label: Налоги
  topic: regulation
  patterns: ['налог', '\bндс\b', '\bндфл\b', '\bндпи\b', '\bфнс\b', 'налогов\w* (кодекс|нагрузк|реформ|льгот)', 'страхов\w* взнос', 'упрощенк']
  bank_query: налоги бюджет фискальная политика
  indicators: [budget]
  directions:
    tighten: ['повышени\w*.{0,30}(налог|ндс|ставк\w* налог)', '(налог|ндс)\w*.{0,30}(повыс|увелич|вырас)', 'отмен\w*.{0,20}льгот']
    ease: ['(снижени|отмен)\w*.{0,30}(налог|ндс)', 'налогов\w* льгот']

excise_alcohol:
  label: Акцизы и алкогольный рынок
  topic: regulation
  patterns: ['акциз', 'алкогол', '\bпив(о|а|ные)\b', 'винодел', '\bвин(о|а)\b', 'маркировк', '\bегаис\b', 'слабоалкогольн', 'безалкогольн\w* напит', 'сладк\w* напит']
  bank_query: акцизы алкоголь напитки регулирование
  indicators: [excise]
  directions:
    tighten: ['(повыс|увелич|рост|подня)\w*.{0,30}(акциз|пошлин)', '(акциз|пошлин)\w*.{0,30}(вырас|повыс|увелич|подня)', 'запрет\w*.{0,30}(продаж|ввоз)']
    ease: ['(сниж|отмен|обнул)\w*.{0,30}(акциз|пошлин)', '(акциз|пошлин)\w*.{0,30}(снизи|отмен|обнул)']

customs_trade:
  label: Таможня, пошлины, экспорт и импорт
  topic: regulation
  patterns: ['пошлин', 'таможн', 'параллельн\w* импорт', 'экспортн\w* (квот|пошлин|ограничени)', 'запрет\w* (на )?(экспорт|импорт|ввоз|вывоз)', 'импорт\w* (товар|продукци)', 'внешнеторгов', '\bфтс\b']
  bank_query: внешняя торговля экспорт импорт пошлины
  indicators: [trade_balance, current_account]
  directions:
    tighten: ['(ввел|введ|повыш|увелич)\w*.{0,30}(пошлин|квот|запрет|ограничени)', 'запрет\w*.{0,20}(экспорт|импорт)']
    ease: ['(снизил|отмен|обнулил|снят)\w*.{0,30}(пошлин|квот|запрет|ограничени)']

sanctions:
  label: Санкции и ограничения
  topic: regulation
  patterns: ['санкци', 'вторичн\w* ограничени', 'sdn', 'блокирующ\w* ограничени', 'пакет\w* ограничений', 'ограничительн\w* мер']
  bank_query: санкции ограничения внешняя торговля
  indicators: []

payments_infra:
  label: Международные расчёты
  topic: currency
  patterns: ['трансграничн\w* (платеж|расчет)', 'расчет\w* (в|с) (китай|контрагент|нацвалют|национальн)', 'платеж\w* (в|из) (китай|оаэ|турци|инди)', 'валютн\w* (контрол|контроль|выручк)', 'обязательн\w* продаж\w* валютн']
  bank_query: валютная выручка расчеты платежи
  indicators: []

rail_logistics:
  label: Железнодорожные перевозки
  topic: logistics
  patterns: ['\bржд\b', 'железнодорожн', 'погрузк\w* на сети', 'вагон', 'тариф\w* на (грузовые )?перевоз', 'восточн\w* полигон', 'транссиб', '\bбам\b']
  bank_query: грузоперевозки погрузка РЖД логистика
  indicators: [rail_loading]

sea_logistics:
  label: Порты и морские перевозки
  topic: logistics
  patterns: ['\bпорт(ы|ов|у|а)?\b', 'морск\w* (перевоз|порт|логист)', 'фрахт', 'контейнер', 'новороссийск', 'азовск', 'черноморск', 'перевалк']
  bank_query: порты морские перевозки логистика экспорт
  indicators: []

road_logistics:
  label: Автоперевозки и погранпереходы
  topic: logistics
  patterns: ['автоперевоз', 'грузоперевоз', 'грузовик', 'фур(а|ы)', 'пункт\w* пропуска', 'погранпереход', 'верхний ларс', 'платон', 'дальнобой']
  bank_query: автоперевозки логистика пункты пропуска
  indicators: []

state_spending:
  label: Госзаказ и бюджетные расходы
  topic: demand
  patterns: ['госзакуп', 'госконтракт', 'бюджетн\w* (расход|ассигнован|финансирован)', 'нацпроект', 'национальн\w* проект', 'дорожн\w* (фонд|строительств)', 'инфраструктурн\w* (проект|кредит)', 'минфин\w*.{0,40}(бюджет|расход)', 'дефицит\w* бюджет', 'проект\w* бюджет', 'бюджет\w* на 20\d\d', 'расход\w* (федерального )?бюджет']
  bank_query: бюджет расходы инвестиции инфраструктура
  indicators: [budget]
  directions:
    down: ['(сокращ|урез|снижени)\w*.{0,30}(расход|финансирован|ассигнован)', 'секвестр', 'расход\w*.{0,40}(заморож|сокращ|урез)', 'заморож\w*.{0,20}расход']
    up: ['(увелич|рост|дополнительн)\w*.{0,30}(расход|финансирован|ассигнован)']

business_activity:
  label: Деловая активность и рост экономики
  topic: demand
  patterns: ['\bввп\b', 'экономическ\w* (рост|активност)', '\bpmi\b', 'деловой активност', 'промышленн\w* производств', 'макростатистик', 'охлаждени\w* экономик', 'рецесси']
  bank_query: макростатистика ВВП экономика рост деловая активность
  indicators: [gdp, industrial_production]
  directions:
    down: ['(ввп|рост|активност|производств)\w*.{0,40}(замедлил|снизил|сократил|упал)', 'охлаждени', 'рецесси']
    up: ['(ввп|рост|активност|производств)\w*.{0,40}(ускорил|вырос|увеличил)']

pharma_regulation:
  label: Фармрынок и его регулирование
  topic: regulation
  patterns: ['лекарств', 'фармацевт', 'фармрын', 'аптечн', 'медиздели', 'медицинск\w* издели']
  bank_query: фармацевтика рынок лекарств
  indicators: []

it_regulation:
  label: ИТ-отрасль и её регулирование
  topic: regulation
  patterns: ['ит-компан', 'ит-отрасл', 'аккредитованн\w* ит', 'импортозамещени\w* (по|программн)', 'отечественн\w* (по|программн)', 'реестр\w* (российского )?по']
  bank_query: ИТ отрасль льготы
  indicators: []
