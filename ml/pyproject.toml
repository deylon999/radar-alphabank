[project]
name = "radar-ml"
version = "0.1.0"
description = "ML-сервис «Радара»: профиль компании, сбор новостей, аналитика банка, отбор событий и агент интерпретации"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "httpx>=0.27,<1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "pyyaml>=6,<7",
    "jinja2>=3.1,<4",
    "feedparser>=6.0,<7",
    "trafilatura>=1.12,<3",
    "pypdf>=4.3,<6",
    "python-docx>=1.1,<2",
    "snowballstemmer>=2.2,<4",
    "python-multipart>=0.0.9,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "reportlab>=4.2,<5",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP046", "UP047"]
