services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: ${RADAR_DB_USERNAME:-radar}
      POSTGRES_PASSWORD: ${RADAR_DB_PASSWORD:?Укажите RADAR_DB_PASSWORD в .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  postgres-data:
