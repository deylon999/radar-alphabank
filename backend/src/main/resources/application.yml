spring:
  application:
    name: radar
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  docker:
    compose:
      lifecycle-management: start-only
  datasource:
    url: ${RADAR_DB_URL:jdbc:postgresql://localhost:5432/radar}
    username: ${RADAR_DB_USERNAME:radar}
    password: ${RADAR_DB_PASSWORD}
  data:
    redis:
      host: ${RADAR_REDIS_HOST:localhost}
      port: ${RADAR_REDIS_PORT:6379}
      password: ${RADAR_REDIS_PASSWORD:}

server:
  port: ${RADAR_PORT:8080}
  servlet:
    context-path: /api
    session:
      cookie:
        name: SESSION
        path: /
        http-only: true
        secure: true
        same-site: lax

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

radar:
  log-dir: ${RADAR_LOG_DIR:logs}
  cors:
    allowed-origins: ${RADAR_CORS_ALLOWED_ORIGINS:}
